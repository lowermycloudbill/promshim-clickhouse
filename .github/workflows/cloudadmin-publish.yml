name: cloudadmin publish

# On every push to the cloudadmin integration branch: run the fast Go gate
# (fmt/tidy/lint/script/config checks + build + vet + unit tests + race) and,
# only if it passes, build and publish the promshim image to Docker Hub
# cloudadminio. Gate and publish live in one job on purpose: steps run
# sequentially on a single runner, so the publish steps are reached only when
# every gate step succeeds, and it avoids scheduling a second dependent runner.
# Requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets (repo or org-visible).

on:
  push:
    branches:
      - cloudadmin
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudadmin-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Gate & publish
    runs-on: ubuntu-latest
    env:
      GOLANGCI_LINT_VERSION: v2.11.4
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint
          curl -sSfL https://golangci-lint.run/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_LINT_VERSION}"
          golangci-lint version
          shellcheck --version
          yamllint --version

      - name: Run fast checks
        run: make fmt-check tidy-check lint script-check config-check build vet

      - name: Run unit tests
        run: make test

      - name: Run unit tests with race detector
        run: make test-race

      # Everything below only runs if every gate step above succeeded.
      - name: Compute image metadata
        id: meta
        run: |
          {
            echo "sha_short=$(git rev-parse --short HEAD)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push promshim
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            cloudadminio/promshim-clickhouse:cloudadmin
            cloudadminio/promshim-clickhouse:${{ steps.meta.outputs.sha_short }}
          build-args: |
            VERSION=cloudadmin-${{ steps.meta.outputs.sha_short }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
